<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BClear Lab — social preview (English)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Golos+Text:wght@400;500;600&family=Noto+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#ECECF3;--card:#fff;--ink:#14141B;--ink2:#4B4B59;--ink3:#63636E;
  --mint:#64FFE3;--mint-soft:#D5FFF6;--deep:#00775F;--lilac:#EADCFE;--lilac-ink:#5B2CA8;
  --warn:#E5384A;--line:#E0E0EA;
  --f-d:"Jost","Century Gothic",sans-serif;--f-t:"Golos Text",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#7A7A8C;font-family:var(--f-t);padding:40px;display:grid;justify-items:center}

/* Английская версия assets/og-source.html. Правки в раскладке вносите
   в оба файла, иначе превью двух версий сайта разъедутся.
   Карточка ровно 1200x630 — размер, который читают мессенджеры и соцсети. */
.og{
  width:1200px;height:630px;position:relative;overflow:hidden;background:var(--ground);color:var(--ink);
  display:grid;grid-template-columns:1fr 420px;gap:44px;padding:56px 56px 56px 64px;align-items:center;
}
.og-text{display:flex;flex-direction:column;justify-content:center;height:100%}
.logo{height:38px;width:auto;display:block;align-self:flex-start}

h1{
  font-family:var(--f-d);font-weight:600;font-size:54px;line-height:1.1;
  letter-spacing:-.03em;margin:30px 0 0;text-wrap:balance;
}
.flag-h1{
  width:58px;height:29px;display:inline-block;vertical-align:-2px;margin-left:16px;
  border-radius:3px;box-shadow:0 0 0 1.5px rgba(20,20,45,.14);
}

.sub{margin:20px 0 0;font-size:19.5px;line-height:1.46;color:var(--ink2);max-width:30em}

.chips{margin:26px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{
  border-radius:99px;padding:11px 17px;font-size:16px;font-weight:500;
  display:flex;align-items:center;gap:9px;
}
.chip svg{width:17px;height:17px;flex:none}
/* лиловые — что делает приложение, мятные — что получает человек */
.c-does{background:var(--lilac);color:var(--lilac-ink)}
.c-gets{background:var(--mint);color:#06342A}

/* правая колонка — реальный кадр разбора */
.panel{
  background:var(--card);border-radius:26px;padding:20px;
  box-shadow:0 4px 10px rgba(20,20,45,.06),0 22px 50px rgba(20,20,45,.11);
}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel-head strong{font-family:var(--f-d);font-weight:600;font-size:17px}
.panel-head .tag{background:var(--mint);border-radius:99px;padding:6px 13px;font-size:13.5px;font-weight:600}
.ipa{font-family:"Noto Sans",var(--f-t)}

.shot{position:relative;width:380px;height:398px;border-radius:16px;overflow:hidden;background:var(--ground)}
/* Окно .shot показывает участок hero-face.jpg (1478x1020) от точки 437,320
   размером 573x600 — нос, губы и подбородок. Ширина .shot-inner задает
   масштаб: 980.3 / 1478 = 0.6633, смещения — та же точка в этом масштабе.
   Меняя кадр, пересчитайте все четыре числа, разметка поедет за ними сама. */
.shot-inner{position:absolute;width:980.3px;height:676.6px;left:-290.1px;top:-212.2px}
.shot-inner img{display:block;width:100%;height:100%}
.shot-inner svg{position:absolute;inset:0;width:100%;height:100%}

.legend{margin:13px 0 0;display:flex;gap:20px;font-size:13.5px;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:block;width:20px;height:0;flex:none}
.k-now{border-top:3px solid var(--warn)}
.k-goal{border-top:3px dashed var(--deep)}
</style>
</head>
<body>

<div class="og" id="og">
  <div class="og-text">
    <img class="logo" src="logo-wordmark.svg" alt="">

    <h1>AI coach for English pronunciation<svg class="flag-h1" viewBox="0 0 60 30" role="img" aria-label="British English"><clipPath id="f"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#f)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg></h1>

    <p class="sub">The app reads your articulation through the camera and your sound through the microphone, with a cue for every sound.</p>

    <div class="chips">
      <span class="chip c-does">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 13.6 8 18.8 9.6 13.6 11.2 12 16 10.4 11.2 5.2 9.6 10.4 8z"/><path d="M18.4 15.2 19.2 17.6 21.6 18.4 19.2 19.2 18.4 21.6 17.6 19.2 15.2 18.4 17.6 17.6z"/></svg>
        AI breakdown of every sound
      </span>
      <span class="chip c-does">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4M8 6.5v11M12 3.5v17M16 6.5v11M20 10v4"/></svg>
        Clear pronunciation
      </span>
      <span class="chip c-gets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 9.5 17 19 7"/></svg>
        Understood first time
      </span>
      <span class="chip c-gets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 9.5 17 19 7"/></svg>
        You fit right in
      </span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><strong>Attempt breakdown</strong><span class="tag"><span class="ipa">/uː/</span> in school</span></div>
    <div class="shot">
      <div class="shot-inner">
        <img src="hero-face.jpg" alt="">
        <!-- viewBox совпадает с пикселями hero-face.jpg, поэтому точки разметки
             привязаны к лицу и переживают любое перекадрирование .shot-inner.
             Толщина линий подобрана так, чтобы на карточке остаться ~4.6px. -->
        <svg viewBox="0 0 1478 1020">
          <ellipse cx="723.9" cy="699.8" rx="157.5" ry="79.1" transform="rotate(-1.2 723.9 699.8)" fill="none" stroke="#00775F" stroke-width="7" stroke-dasharray="20.8 15.6"/>
          <path d="M675.3 565.2 765.8 565.2 831.8 624.9 846.6 724.5 809.3 831.5 645.8 831.5 581.9 738.2 611 617.4Z" fill="none" stroke="#E5384A" stroke-width="7" stroke-linejoin="round"/>
          <g fill="#E5384A">
            <circle cx="675.3" cy="565.2" r="16.5"/>
            <circle cx="765.8" cy="565.2" r="16.5"/>
            <circle cx="831.8" cy="624.9" r="16.5"/>
            <circle cx="846.6" cy="724.5" r="16.5"/>
            <circle cx="809.3" cy="831.5" r="16.5"/>
            <circle cx="645.8" cy="831.5" r="16.5"/>
            <circle cx="581.9" cy="738.2" r="16.5"/>
            <circle cx="611" cy="617.4" r="16.5"/>
          </g>
        </svg>
      </div>
    </div>
    <p class="legend">
      <span><i class="k-now"></i>your articulation</span>
      <span><i class="k-goal"></i>target</span>
    </p>
  </div>
</div>

</body>
</html>
