<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>BClear Lab — превью для мессенджеров</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --ground:#ECECF3;--card:#fff;--ink:#14141B;--ink2:#4B4B59;--ink3:#63636E;
  --mint:#64FFE3;--mint-soft:#D5FFF6;--deep:#00775F;--lilac:#EADCFE;--lilac-ink:#5B2CA8;
  --warn:#E5384A;--line:#E0E0EA;
  --f-d:"Jost","Century Gothic",sans-serif;--f-t:"Wix Madefor Text",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#7A7A8C;font-family:var(--f-t);padding:40px;display:grid;justify-items:center}

/* карточка ровно 1200x630 — размер, который читают мессенджеры и соцсети */
.og{
  width:1200px;height:630px;position:relative;overflow:hidden;background:var(--ground);color:var(--ink);
  display:grid;grid-template-columns:1fr 420px;gap:44px;padding:56px 56px 56px 64px;align-items:center;
}
.og-text{display:flex;flex-direction:column;justify-content:center;height:100%}
.logo{height:38px;width:auto;display:block;align-self:flex-start}

h1{
  font-family:var(--f-d);font-weight:600;font-size:54px;line-height:1.1;
  letter-spacing:-.03em;margin:30px 0 0;text-wrap:balance;
}
.flag-h1{
  width:58px;height:29px;display:inline-block;vertical-align:-2px;margin-left:16px;
  border-radius:3px;box-shadow:0 0 0 1.5px rgba(20,20,45,.14);
}

.sub{margin:20px 0 0;font-size:19.5px;line-height:1.46;color:var(--ink2);max-width:30em}

.chips{margin:26px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{
  border-radius:99px;padding:11px 17px;font-size:16px;font-weight:500;
  display:flex;align-items:center;gap:9px;
}
.chip svg{width:17px;height:17px;flex:none}
/* лиловые — что делает приложение, мятные — что получает человек */
.c-does{background:var(--lilac);color:var(--lilac-ink)}
.c-gets{background:var(--mint);color:#06342A}

/* правая колонка — реальный кадр разбора */
.panel{
  background:var(--card);border-radius:26px;padding:20px;
  box-shadow:0 4px 10px rgba(20,20,45,.06),0 22px 50px rgba(20,20,45,.11);
}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel-head strong{font-family:var(--f-d);font-weight:600;font-size:17px}
.panel-head .tag{background:var(--mint);border-radius:99px;padding:6px 13px;font-size:13.5px;font-weight:600}
.ipa{font-family:"Noto Sans",var(--f-t)}

.shot{position:relative;width:380px;height:398px;border-radius:16px;overflow:hidden;background:var(--ground)}
/* Окно .shot показывает лицо целиком: участок face-full.jpg (1536x1024)
   от точки 317,20 размером 917x960 — от бровей до подбородка. Ширина
   .shot-inner задает масштаб: 636.5 / 1536 = 0.4144, смещения — та же
   точка в этом масштабе. Разметка в пикселях самого фото и едет за кадром. */
.shot-inner{position:absolute;width:636.5px;height:424.3px;left:-131.4px;top:-8.3px}
.shot-inner img{display:block;width:100%;height:100%}
.shot-inner svg{position:absolute;inset:0;width:100%;height:100%}

.legend{margin:13px 0 0;display:flex;gap:20px;font-size:13.5px;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:block;width:20px;height:0;flex:none}
.legend .k-dot{width:7px;height:7px;border-radius:50%;background:#3FD9BE}
/* Фото — кадр с фронтальной камеры пользователя, а не аватар коуча:
   рамка телефона, вырез камеры и таймер записи. Таймер стоит слева,
   чтобы не заезжать под вырез. */
.shot{border:9px solid #14141B;border-radius:30px}
.shot::before{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);width:62px;height:15px;border-radius:99px;background:#14141B;z-index:3}
.cam-rec{position:absolute;left:12px;top:12px;letter-spacing:.06em;z-index:2;display:flex;align-items:center;gap:7px;
  background:rgba(20,20,27,.62);color:#fff;font-size:12.5px;font-weight:500;line-height:1;padding:6px 11px 6px 9px;border-radius:99px}
.cam-rec i{display:block;width:8px;height:8px;border-radius:50%;background:#FF3B4E}
.k-goal{border-top:3px dashed var(--deep)}
</style>
</head>
<body>

<div class="og" id="og">
  <div class="og-text">
    <img class="logo" src="logo-wordmark.svg" alt="">

    <h1>ИИ-коуч английского произношения<svg class="flag-h1" viewBox="0 0 60 30" role="img" aria-label="британский вариант"><clipPath id="f"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#f)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg></h1>

    <p class="sub">Приложение через камеру и микрофон сканирует вашу мимику и произношение, выдавая подсказки к каждому звуку.</p>

    <div class="chips">
      <span class="chip c-does">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 13.6 8 18.8 9.6 13.6 11.2 12 16 10.4 11.2 5.2 9.6 10.4 8z"/><path d="M18.4 15.2 19.2 17.6 21.6 18.4 19.2 19.2 18.4 21.6 17.6 19.2 15.2 18.4 17.6 17.6z"/></svg>
        ИИ-разбор ошибок
      </span>
      <span class="chip c-does">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4M8 6.5v11M12 3.5v17M16 6.5v11M20 10v4"/></svg>
        Четкое произношение
      </span>
      <span class="chip c-gets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 9.5 17 19 7"/></svg>
        Понимают с первого раза
      </span>
      <span class="chip c-gets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 9.5 17 19 7"/></svg>
        Принимают за своего
      </span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><strong>Ваша фронтальная камера</strong><span class="tag"><span class="ipa">/uː/</span> в school</span></div>
    <div class="shot">
      <span class="cam-rec"><i></i>REC</span>
      <div class="shot-inner">
        <img src="face-full.jpg" alt="">
        <!-- разметка в пикселях face-full.jpg (1536x1024): точки по контуру губ, как у распознавания лиц -->
        <svg viewBox="0 0 1536 1024"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#00332B" flood-opacity=".55"/></filter></defs><g filter="url(#sh)"><g fill="none" stroke="#64FFE3" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round" opacity=".9"><polygon points="650 662 690 600 735 572 775 580 815 572 862 600 902 662 870 715 825 745 772 754 720 745 678 715"/><polygon points="705 656 745 640 775 645 808 640 848 656 808 668 775 672 745 668"/></g><g fill="#64FFE3"><circle cx="650" cy="662" r="6.0"/><circle cx="690" cy="600" r="6.0"/><circle cx="735" cy="572" r="6.0"/><circle cx="775" cy="580" r="6.0"/><circle cx="815" cy="572" r="6.0"/><circle cx="862" cy="600" r="6.0"/><circle cx="902" cy="662" r="6.0"/><circle cx="870" cy="715" r="6.0"/><circle cx="825" cy="745" r="6.0"/><circle cx="772" cy="754" r="6.0"/><circle cx="720" cy="745" r="6.0"/><circle cx="678" cy="715" r="6.0"/><circle cx="705" cy="656" r="6.0"/><circle cx="745" cy="640" r="6.0"/><circle cx="775" cy="645" r="6.0"/><circle cx="808" cy="640" r="6.0"/><circle cx="848" cy="656" r="6.0"/><circle cx="808" cy="668" r="6.0"/><circle cx="775" cy="672" r="6.0"/><circle cx="745" cy="668" r="6.0"/></g></g></svg>
      </div>
    </div>
    <p class="legend">
      <span><i class="k-dot"></i>ваша артикуляция</span>
    </p>
  </div>
</div>

</body>
</html>
