# Повторяет поведение GitHub Pages (как serve-site.py при локальном просмотре):
#   /about  → about.html
#   /blog   → 301 на /blog/, там отдаётся blog/index.html
#   нет такой страницы → 404.html с кодом 404

# www.bclearlab.ru → bclearlab.ru
server {
    listen 80;
    server_name www.bclearlab.ru;
    return 301 https://bclearlab.ru$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Перед nginx стоит прокси Timeweb: в редиректах не подставляем свой порт и схему
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    # Как у GitHub Pages: 10 минут, чтобы правки доходили быстро
    expires 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    error_page 404 /404.html;

    # папка без слеша в конце → редирект со слешем, как у GitHub Pages
    # (на уровне server, а не внутри location: там if сбрасывает try_files)
    if (-d $request_filename) {
        rewrite [^/]$ $uri/ permanent;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
